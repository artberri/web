# Projects page. `image` is a resource of content/pages/projects/.
supported:
  - name: Sideline
    kind: Claude Code mod
    url: https://github.com/artberri/sideline
    cta: GitHub
    image: images/sideline.png
    description: >-
      A Claude Code mod that keeps the conversation clean: long commands, diffs
      and tool chatter step aside into a tidy pane with your changes, commits
      and commands.
    post: /blog/2026/11/claude-code-talks-too-much/
    tags: [TypeScript, Claude Code]

  - name: DIOD
    kind: npm library
    url: https://github.com/artberri/diod
    cta: GitHub
    image: images/diod.jpg
    description: >-
      A very opinionated and lightweight (under 2kB minified and gzipped)
      inversion of control container and dependency injector for Node.js or
      browser apps. Its true power shows when building Typescript apps.
    tags: [TypeScript, IoC]

  - name: rollup-plugin-istanbul
    kind: npm library
    url: https://github.com/artberri/rollup-plugin-istanbul
    cta: GitHub
    image: images/rollup-javascript.png
    description: >-
      Seamless integration between the module bundler Rollup.js and the code
      coverage tool Istanbul.
    tags: [JavaScript, Rollup]

  - name: Unsafe Typescript Highlighter
    kind: VS Code extension
    url: https://marketplace.visualstudio.com/items?itemName=alberto-varela.unsafe-typescript
    cta: Marketplace
    image: images/unsafe-ts.png
    description: >-
      A Visual Studio Code extension that visually marks out unsafe Typescript
      features in your code.
    tags: [TypeScript, VS Code]

  - name: Monorepo Focus Workspace
    kind: VS Code extension
    url: https://marketplace.visualstudio.com/items?itemName=alberto-varela.monorepo-focus-workspace
    cta: Marketplace
    image: images/monorepo-focus-workspace.png
    description: >-
      Helps manage monorepos by creating a partial tree view to focus on one or
      more workspaces. Supports npm, Yarn, pnpm, Lerna and Bun.
    tags: [Monorepos, VS Code]

  - name: Izenak
    kind: Web app
    url: https://izenak.eus/
    cta: izenak.eus
    image: images/izenak.png
    description: >-
      A progressive web app, optimised for mobile, to find a Basque name for
      your baby. I built it to choose the names of my daughters and made it
      public to help other Basque parents.
    tags: [PWA, Euskara]

  - name: Express HTTP Context 2
    kind: npm library
    url: https://github.com/artberri/express-http-context2
    cta: GitHub
    image: images/express-http-context2.png
    description: >-
      Modern request-scoped storage for Express.js, based on native Node.js
      Asynchronous Local Storage. A drop-in replacement for express-http-context
      with ESM support and no dependencies.
    tags: [TypeScript, Express]

